{% extends "base.html" %}
{% macro error_content() %}<section class="error-page"><span class="eyebrow">ESCALAPRO / {{ code }}</span><h1>{{ title }}</h1><p>{{ message }}</p><a class="button primary"
   href="{{ url_for('dashboard.index') if current_user else url_for('auth.login') }}">Voltar ao início {{ icon('arrow', 17) }}</a></section>{% endmacro %}
{% block content %}{{ error_content() }}{% endblock %}
{% block public_content %}{{ error_content() }}{% endblock %}
