{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-stack" aria-live="polite">{% for category, message in messages %}<div class="flash flash-{{ category }}"
     role="{% if category == 'error' %}alert{% else %}status{% endif %}"><span>{{ message }}</span><button type="button" class="flash-close" aria-label="Fechar mensagem">×</button></div>{% endfor %}</div>{% endif %}{% endwith %}
