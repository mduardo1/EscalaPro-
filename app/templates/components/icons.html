{% macro icon(name, size=20) -%}
  <svg width="{{ size }}"
       height="{{ size }}"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="1.7"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    {% if name == "grid" %}
      <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
    {% elif name == "users" %}
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
      <circle cx="9" cy="7" r="4" />
    {% elif name == "clock" %}
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    {% elif name == "calendar" %}
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M16 3v4M8 3v4M3 11h18m-13 5h3m3 0h2" />
    {% elif name == "settings" %}
      <path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z" />
      <circle cx="12" cy="12" r="3" />
    {% elif name == "logout" %}
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9" />
    {% elif name == "arrow" %}
      <path d="M4 12h16m-6-6 6 6-6 6" />
    {% elif name == "plus" %}
      <path d="M12 5v14M5 12h14" />
    {% elif name == "alert" %}
      <path d="m10.3 3.8-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.2l-8-14a2 2 0 0 0-3.4 0Z" />
      <path d="M12 9v4m0 4h.01" />
    {% elif name == "download" %}
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3" />
    {% elif name == "search" %}
      <circle cx="10.5" cy="10.5" r="6.5" />
      <path d="m16 16 5 5" />
    {% elif name == "check" %}
      <path d="m5 12 4 4L19 6" />
    {% elif name == "menu" %}
      <path d="M4 6h16M4 12h16M4 18h16" />
    {% elif name == "chevron" %}
      <path d="m9 5 7 7-7 7" />
    {% else %}
      <circle cx="12" cy="12" r="9" />
      <path d="M12 8v4m0 4h.01" />
    {% endif %}
  </svg>
{%- endmacro %}
