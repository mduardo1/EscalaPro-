name: Regressão SQLite e PostgreSQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: escalapro_test
          POSTGRES_USER: escalapro_test
          POSTGRES_PASSWORD: isolated-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U escalapro_test -d escalapro_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      PYTHON_DOTENV_DISABLED: "1"
      TEST_DATABASE_URL: postgresql+psycopg://escalapro_test:isolated-test-only@localhost:5432/escalapro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -v -W error --cov=app --cov-branch --cov-report=term-missing
      - run: gunicorn --config gunicorn.conf.py --check-config 'app:create_app()'
        env:
          APP_ENV: development
          SECRET_KEY: ci-fake-secret-with-over-32-characters
          MAIL_TRANSPORT: disabled
